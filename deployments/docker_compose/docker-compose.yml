services:
  # --- Main Application Service ---
  aac-kea:
    image: "mariadb:11.4"
    container_name: "aac-kea"
    hostname: "kea-db"
    restart: "always"


    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}"
      MYSQL_DATABASE: "kea"
      MYSQL_USER: "kea"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env (see .env.example)}"
      TZ: "Europe/Berlin"

    ports:
      - "3333:3306/tcp"

    volumes:
      - "/export/docker/aac-kea/db:/var/lib/mysql"

    networks:
      - exposed
      - interconnect
      - stack_internal


    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    security_opt:
    - apparmor:unconfined



networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-kea_stack_internal"
    driver: "bridge"

